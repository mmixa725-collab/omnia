services:
  - type: web
    name: omnia-telegram-mini-app
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_MODE
        value: "true"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DEVELOPMENT_MODE
        value: "false"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: "https://proxy.gen-api.ru/v1"
      - key: AI_MODEL
        value: "deepseek-v4-flash"
