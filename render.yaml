services:
  - type: web
    name: omnia-telegram-mini-app
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_MODE
        value: "true"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DEVELOPMENT_MODE
        value: "false"
